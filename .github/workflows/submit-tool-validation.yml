name: Submit-tool validation

on:
  pull_request:
    branches:
      - submit-workflow
  push:
    branches:
      - submit-workflow
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Build, Pylint, and ShellCheck
    runs-on: ubuntu-24.04
    steps:
      - name: Check out submit-tool
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y shellcheck

      - name: Build and install the local virtual environment
        run: make clobber all install

      - name: Run Pylint and ShellCheck
        shell: bash
        run: |
          source venv/bin/activate
          bin/pychk.sh

  ubuntu-e2e:
    name: Disposable Ubuntu Apache install, login, and upload
    runs-on: ubuntu-24.04
    environment: submit-httpd-e2e
    if: >-
      github.ref == 'refs/heads/submit-workflow' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Check out submit-tool
        uses: actions/checkout@v7

      - name: Require private Apache configuration access
        env:
          SUBMIT_HTTPD_READ_TOKEN: ${{ secrets.SUBMIT_HTTPD_READ_TOKEN }}
        run: |
          if [[ -z $SUBMIT_HTTPD_READ_TOKEN ]]; then
            echo "Configure the SUBMIT_HTTPD_READ_TOKEN Actions secret with read-only access to lcn2/submit.httpd" >&2
            exit 1
          fi

      - name: Check out submit.httpd
        uses: actions/checkout@v7
        with:
          repository: lcn2/submit.httpd
          ref: master
          path: submit.httpd
          token: ${{ secrets.SUBMIT_HTTPD_READ_TOKEN }}
          persist-credentials: false

      - name: Check out mkiocccentry
        uses: actions/checkout@v7
        with:
          repository: ioccc-src/mkiocccentry
          ref: d494d2bb5cfb35c8d5417d53752ea9d2c8141179
          path: mkiocccentry
          persist-credentials: false

      - name: Install Apache, SELinux utilities, and build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            apache2 \
            build-essential \
            curl \
            libapache2-mod-wsgi-py3 \
            openssl \
            policycoreutils \
            policycoreutils-python-utils \
            python3-pip \
            python3-venv \
            rsync \
            selinux-policy-default \
            selinux-utils

      - name: Build mkiocccentry
        working-directory: mkiocccentry
        run: make clobber all

      - name: Configure disposable Apache test host
        shell: bash
        run: |
          if ! getent group apache >/dev/null; then
            sudo groupadd --system apache
          fi
          if ! getent passwd apache >/dev/null; then
            sudo useradd --system --gid apache --home-dir /var/www \
              --shell /usr/sbin/nologin apache
          fi

          sudo systemctl stop apache2
          sudo install -d /etc/httpd
          sudo cp -a submit.httpd/. /etc/httpd/
          # The RHEL configuration repository uses links to RHEL-specific
          # paths. Replace these links with writable Ubuntu test directories.
          sudo rm -f /etc/httpd/modules /etc/httpd/run /etc/httpd/state
          sudo install -d /etc/httpd/modules /etc/httpd/run \
            /etc/httpd/state /var/ioccc/etc /var/log/httpd /var/log/ioccc \
            /var/log/trap-httpd /var/trap-www/html
          sudo touch /var/ioccc/etc/save.iocccpasswd.json
          for module in /usr/lib/apache2/modules/*.so; do
            sudo ln -sfn "$module" "/etc/httpd/modules/${module##*/}"
          done
          # Ubuntu statically builds a few modules that the RHEL config
          # attempts to load dynamically. Drop only those redundant entries.
          while IFS= read -r module; do
            sudo sed -i \
              "/^[[:space:]]*LoadModule[[:space:]]*${module}[[:space:]]/d" \
              /etc/httpd/conf.modules.d/*.conf
          done < <(sudo apache2 -l | awk \
            '/^ *mod_.*[.]c$/ { module = $1; sub(/^mod_/, "", module); sub(/[.]c$/, "", module); print module "_module" }')
          while read -r module module_path; do
            if [[ ! -e /etc/httpd/${module_path} ]]; then
              sudo sed -i \
                "/^[[:space:]]*LoadModule[[:space:]]*${module}[[:space:]]/d" \
                /etc/httpd/conf.modules.d/*.conf
            fi
          done < <(awk \
            '/^[[:space:]]*LoadModule[[:space:]]/ { print $2, $3 }' \
            /etc/httpd/conf.modules.d/*.conf)

          # The checked-out production config binds to the submit server's
          # public address. Rebind only the disposable copy to loopback.
          sudo find /etc/httpd -type f -name '*.conf' \
            -exec sed -i 's/209\.94\.60\.67/127.0.0.1/g' {} +

          sudo install -d /etc/letsencrypt/live/submit.ioccc.org
          sudo openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj /CN=submit.ioccc.org \
            -keyout /etc/letsencrypt/live/submit.ioccc.org/privkey.pem \
            -out /etc/letsencrypt/live/submit.ioccc.org/fullchain.pem
          sudo install -m 0644 /dev/null \
            /etc/letsencrypt/options-ssl-apache.conf
          printf '127.0.0.1 submit.ioccc.org\n' | sudo tee -a /etc/hosts >/dev/null

      - name: Build and install submit-tool locally
        run: make clobber all install

      - name: Run Pylint and ShellCheck
        shell: bash
        run: |
          source venv/bin/activate
          bin/pychk.sh

      - name: Install submit-tool under /var/ioccc
        run: |
          sudo env "PATH=$PATH" PIP_BREAK_SYSTEM_PACKAGES=1 \
            PIP_IGNORE_INSTALLED=1 make root_install

      - name: Check SELinux setup tools and Apache configuration
        run: |
          sudo semanage fcontext --list >/dev/null
          sudo apache2 -f /etc/httpd/conf/httpd.conf -t

      - name: Open the disposable contest window
        run: |
          sudo /usr/bin/python3 - <<'PY'
          import datetime
          import json
          from pathlib import Path

          state_file = Path("/var/ioccc/etc/state.json")
          state = json.loads(state_file.read_text())
          now = datetime.datetime.now(datetime.timezone.utc)
          for field, offset in (("open_date", -1), ("close_date", 1)):
              state[field] = (now + datetime.timedelta(days=offset)).strftime(
                  "%Y-%m-%d %H:%M:%S.%f UTC"
              )
          state_file.write_text(json.dumps(state, indent=4) + "\n")
          PY

      - name: Start Apache and verify login, password change, and upload
        shell: bash
        run: |
          sudo apache2 -f /etc/httpd/conf/httpd.conf -k start
          for attempt in $(seq 1 30); do
            if curl --silent --show-error --insecure \
              --noproxy '*' \
              --resolve submit.ioccc.org:443:127.0.0.1 \
              https://submit.ioccc.org/ -o /tmp/submit-login.html; then
              break
            fi
            sleep 1
          done
          grep -q 'Status: Not logged in' /tmp/submit-login.html

          email="ci-$(openssl rand -hex 16)@example.org"
          account=$(sudo -u apache /usr/local/bin/ioccc_passwd.py \
            -U -E -c -e "$email")
          username=$(sed -n 's/^[[:space:]]*username: //p' <<< "$account")
          password=$(sed -n 's/^[[:space:]]*password: //p' <<< "$account")
          if [[ -z $username || -z $password ]]; then
            echo "Test account generation did not return a username and password" >&2
            exit 1
          fi
          echo "::add-mask::$password"

          (
            cd mkiocccentry
            test_ioccc/gen_submit.sh "$username" "$RUNNER_TEMP/slot_tree"
          )

          TEST_USERNAME="$username" TEST_PASSWORD="$password" python3 - <<'PY'
          import hashlib
          import html
          import http.cookiejar
          import json
          import os
          from pathlib import Path
          import re
          import secrets
          import ssl
          import subprocess
          import urllib.parse
          import urllib.request

          url = "https://submit.ioccc.org/"
          context = ssl._create_unverified_context()
          opener = urllib.request.build_opener(
              urllib.request.ProxyHandler({}),
              urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()),
              urllib.request.HTTPSHandler(context=context),
          )
          login_page = opener.open(url)
          if login_page.status != 200 or b"Status: Not logged in" not in login_page.read():
              raise SystemExit("Login page did not render as expected")

          form = urllib.parse.urlencode({
              "username": os.environ["TEST_USERNAME"],
              "password": os.environ["TEST_PASSWORD"],
          }).encode()
          response = opener.open(urllib.request.Request(url, data=form))
          body = response.read()
          if not response.geturl().endswith("/passwd") or b"Current Password" not in body:
              raise SystemExit("Generated account did not authenticate successfully")

          new_password = secrets.token_urlsafe(24)
          print(f"::add-mask::{new_password}", flush=True)
          form = urllib.parse.urlencode({
              "old_password": os.environ["TEST_PASSWORD"],
              "new_password": new_password,
              "reenter_new_password": new_password,
          }).encode()
          response = opener.open(urllib.request.Request(url + "passwd", data=form), timeout=30)
          if b"Password successfully changed." not in response.read():
              raise SystemExit("Initial password change failed")

          form = urllib.parse.urlencode({
              "username": os.environ["TEST_USERNAME"],
              "password": new_password,
          }).encode()
          response = opener.open(urllib.request.Request(url, data=form), timeout=30)
          if b'name="slot_num"' not in response.read():
              raise SystemExit("Changed password did not unlock the submission page")

          slot = 5
          username = os.environ["TEST_USERNAME"]
          archive_dir = Path(os.environ["RUNNER_TEMP"]) / "slot_tree/good/workdir" / f"{username}-{slot}"
          archives = list(archive_dir.glob(f"submit.{username}-{slot}.*.txz"))
          if len(archives) != 1:
              raise SystemExit("Expected exactly one generated archive for slot 5")
          archive = archives[0]
          original = archive.read_bytes()
          expected_hash = hashlib.sha256(original).hexdigest()

          boundary = secrets.token_hex(24)
          payload = (
              f"--{boundary}\r\n"
              'Content-Disposition: form-data; name="slot_num"\r\n\r\n'
              f"{slot}\r\n"
              f"--{boundary}\r\n"
              f'Content-Disposition: form-data; name="file"; filename="{archive.name}"\r\n'
              "Content-Type: application/x-xz\r\n\r\n"
          ).encode() + original + f"\r\n--{boundary}--\r\n".encode()
          request = urllib.request.Request(url + "update", data=payload, headers={
              "Content-Type": f"multipart/form-data; boundary={boundary}",
          })
          response = opener.open(request, timeout=30)
          if b"was uploaded successfully." not in response.read():
              raise SystemExit("Generated submission upload was not accepted")

          slot_dir = Path("/var/ioccc/users") / username / str(slot)
          stored = subprocess.check_output(["sudo", "cat", str(slot_dir / archive.name)])
          if stored != original:
              raise SystemExit("Stored submission differs from the original archive")
          metadata = json.loads(subprocess.check_output(["sudo", "cat", str(slot_dir / "slot.json")]))
          if (
              metadata["filename"] != archive.name
              or metadata["length"] != len(original)
              or metadata["SHA256"] != expected_hash
          ):
              raise SystemExit("Stored slot filename, length, or SHA256 is incorrect")

          page = opener.open(url + "submit", timeout=30).read().decode()
          rows = re.findall(r"<tr\b[^>]*>(.*?)</tr>", page, re.DOTALL)
          slot_rows = [row for row in rows if f'id="slots{slot}"' in row]
          if len(slot_rows) != 1:
              raise SystemExit("Uploaded slot was not uniquely displayed")
          text = " ".join(html.unescape(re.sub(r"<[^>]+>", " ", slot_rows[0])).split())
          for expected in (
              f"Filename : {archive.name}",
              f"File length : {len(original)}",
              f"SHA256 : {expected_hash}",
          ):
              if not re.search(re.escape(expected) + r"(?=\s|$)", text):
                  raise SystemExit("Uploaded slot page has incorrect filename, length, or SHA256")
          print("Slot 5 upload verified: stored bytes, metadata, and displayed length/SHA256 match.")
          PY

      - name: Stop Apache
        if: always()
        run: |
          if [[ -f /etc/httpd/conf/httpd.conf ]] && pgrep -x apache2 >/dev/null; then
            sudo apache2 -f /etc/httpd/conf/httpd.conf -k stop
          else
            echo "No test Apache process to stop."
          fi
